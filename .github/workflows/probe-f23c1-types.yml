name: PROBE F2.3C.1 database types (temporary, never merge)
on:
  push:
    branches: [codex/probe-f2.3c1-database-types]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
      - name: Disposable type-generation probe
        shell: bash
        run: bash .probe/f23c1/generate.sh
      - name: Preserve probe evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f23c1-types-probe
          path: /tmp/f23c1-types-probe
          retention-days: 14
          if-no-files-found: error
